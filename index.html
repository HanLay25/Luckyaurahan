<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckyAuraHan - SMM Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #111; color: #fff; text-align: center; padding: 50px; }
        .container { max-width: 500px; margin: auto; background: #222; padding: 30px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        h1 { color: #ff69b4; }
        select, input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; box-sizing: border-box; }
        button { background: #ff69b4; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #ff1493; }
        .status { margin-top: 15px; color: #00ff00; font-weight: bold; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>LuckyAuraHan</h1>
        <p>TikTok Likes, Views, Followers ဝန်ဆောင်မှု</p>
        
        <form id="orderForm">
            <select id="service">
                <option value="1000">ID: 1000 - TikTok Followers [High Quality] (Min: 100 / Max: 10000)</option>
                <option value="2000">ID: 2000 - TikTok Likes [Instant] (Min: 100 / Max: 50000)</option>
                <option value="3000">ID: 3000 - TikTok Views [Super Fast] (Min: 500 / Max: 100000)</option>
            </select>
            <input type="url" id="link" placeholder="သင့် TikTok ဗီဒီယို သို့မဟုတ် အကောင့် Link ထည့်ပါ" required>
            <input type="number" id="quantity" placeholder="အရေအတွက် ထည့်ပါ (ဥပမာ - ၁၀၀၀)" required>
            <button type="submit">Order တင်မည်</button>
        </form>
        <div class="status" id="statusMsg"></div>
    </div>

    <script>
    document.getElementById('orderForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const api_url = 'https://socialfastmm.com/api/v2';
        const api_key = 'cd2340c86ff99fba340a21aeaa23bcd'; // Han ရဲ့ API Key အစစ်
        
        const service = document.getElementById('service').value;
        const link = document.getElementById('link').value;
        const qty = document.getElementById('quantity').value;
        const statusMsg = document.getElementById('statusMsg');
        
        statusMsg.innerText = "အော်ဒါကို API SMM စနစ်ဖြင့် ဆောင်ရွက်နေပါသည်...";
        statusMsg.style.color = "#ff69b4";

        try {
            const response = await fetch(api_url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    key: api_key,
                    action: 'add',
                    service: service,
                    link: link,
                    quantity: qty
                })
            });
            
            const data = await response.json();
            
            if (data.order) {
                statusMsg.innerHTML = ` အော်ဒါ အောင်မြင်ပါသည်။<br> Order ID: ${data.order}<br> မှာယူသည့် ID: ${service}<br> အရေအတွက်: ${qty}`;
                statusMsg.style.color = "#00ff00";
            } else if (data.error) {
                statusMsg.innerText = ` Error: ${data.error}`;
                statusMsg.style.color = "#ff0000";
            } else {
                statusMsg.innerText = " စနစ်ချို့ယွင်းမှု ဖြစ်သွားပါသည်။";
                statusMsg.style.color = "#ff0000";
            }
        } catch (error) {
            statusMsg.innerText = " API နှင့် ချိတ်ဆက်ရတာ အဆင်မပြေပါ။";
            statusMsg.style.color = "#ff0000";
        }
    });
    </script>
</body>
</html>
